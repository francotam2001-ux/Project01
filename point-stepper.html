<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一次一點 · 順序助手（離線）</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",Roboto,Arial,sans-serif;
  background:#0f172a;color:#e8eefc;font-size:15px}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.spacer{flex:1}
.pill{background:#1e293b;border:1px solid #334155;border-radius:99px;padding:2px 10px;font-size:12px;color:#9fb3d1}
.pill.ok{background:#052e1b;border-color:#166534;color:#4ade80}

.stage{background:#111c33;border:1px solid #26364f;border-radius:14px;padding:20px;min-height:210px;
  display:flex;flex-direction:column;justify-content:center;gap:12px}
.no{font-size:12px;color:#7b90ad;letter-spacing:1px}
.big{font-size:30px;line-height:1.35;font-weight:700;word-break:break-word}
.big.small{font-size:22px}
.copy{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;color:#7dd3fc;word-break:break-all;
  background:#0b1526;border:1px dashed #2b4162;border-radius:9px;padding:9px 11px;min-height:38px}
.copy.empty{color:#64748b;font-style:italic}

.ctrls{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
button{font-family:inherit;font-size:14px;border-radius:10px;border:1px solid #334155;background:#1b2942;color:#e8eefc;
  padding:11px 16px;cursor:pointer;transition:.15s}
button:hover{background:#24365a}
button.primary{background:#2563eb;border-color:#2563eb;font-weight:600}
button.primary:hover{filter:brightness(1.1)}
button:disabled{opacity:.4;cursor:not-allowed}
.hint{color:#7b90ad;font-size:12.5px;margin-top:10px;line-height:1.6}
kbd{background:#1e293b;border:1px solid #3b4d6b;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:12px}

details{margin-top:16px;background:#111c33;border:1px solid #26364f;border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-size:13px;color:#9fb3d1}
textarea{width:100%;min-height:130px;margin-top:10px;background:#0b1526;color:#dbeafe;border:1px solid #2b4162;
  border-radius:9px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;resize:vertical}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#9fb3d1}
select,input[type=text]{background:#0b1526;color:#dbeafe;border:1px solid #2b4162;border-radius:8px;padding:7px 9px;font-family:inherit;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:#2563eb;color:#fff;
  padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.18s;font-size:13.5px;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){.big{font-size:22px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>🎯 一次一點 · 順序助手</h1>
    <span class="pill" id="prog">0 / 0</span>
    <span class="pill" id="modePill">—</span>
    <span class="spacer"></span>
    <span class="pill" id="autoPill">自動複製：開</span>
  </div>

  <div class="stage">
    <div class="no" id="no">第 0 個</div>
    <div class="big" id="big">請先喺下面貼上你嘅清單（一行一個出入口）</div>
    <div class="copy empty" id="copyBox">（剪貼板內容會顯示喺度）</div>
  </div>

  <div class="ctrls">
    <button id="btnPrev">← 上一個</button>
    <button class="primary" id="btnCopyNext">📋 複製並下一個</button>
    <button id="btnCopy">複製</button>
    <button id="btnNext">下一個 →</button>
  </div>

  <div class="hint">
    鍵盤：<kbd>空白鍵</kbd> 或 <kbd>Enter</kbd> = 複製並下一個　·　<kbd>←</kbd> <kbd>→</kbd> = 上／下一個　·　<kbd>C</kbd> = 只複製<br>
    用法：呢個頁面開住喺隔籬，撳一下 → 剪貼板已經有嘢 → 去 system 搜尋框 <kbd>Ctrl+V</kbd> → Enter → 落點 → 存檔。
  </div>

  <details id="setup">
    <summary>⚙️ 設定：貼上清單 / 揀複製邊一欄</summary>
    <textarea id="listBox" spellcheck="false" placeholder="每行一個出入口，例如：
德輔道中120號 正門	22.28215, 114.15872
德輔道中120號 後門	22.28201, 114.15840
皇后大道中1號 側門	22.27986, 114.16010

（唔想分欄都可以，直接一行一個就得）"></textarea>
    <div class="row">
      <label class="f"><span>複製邊個</span>
        <select id="colPick">
          <option value="0">全行</option>
          <option value="1">第 1 欄</option>
          <option value="2">第 2 欄</option>
          <option value="3">第 3 欄</option>
        </select>
      </label>
      <label class="f"><span>自動複製</span>
        <select id="autoPick"><option value="1">開</option><option value="0">關</option></select>
      </label>
      <button id="btnApply">套用清單</button>
      <button id="btnReset">重設進度</button>
    </div>
    <div class="hint">分欄用 <b>Tab</b> 或 <b>|</b> 分隔。所有資料只留喺你部電腦，唔會上傳。</div>
  </details>
</div>
<div id="toast"></div>
<script>
"use strict";
const LS = "pointStepper.v1";
const $ = id => document.getElementById(id);
let S = { raw: "", lines: [], idx: 0, col: 0, auto: true };

function fields(line){ return line.split(/\t|\s*\|\s*/).map(s => s.trim()); }
function copyTextOf(line){
  if(S.col === 0) return line;
  const f = fields(line);
  return f[S.col - 1] || "";
}
function toast(m){
  const t = $("toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1400);
}
async function copy(t){
  if(!t) return false;
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  const ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try{ ok = document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); return ok;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS) || "null");
    if(d && Array.isArray(d.lines)) S = Object.assign(S, d);
  }catch(e){}
}

function render(doCopy){
  const n = S.lines.length;
  $("prog").textContent = n ? `${Math.min(S.idx + 1, n)} / ${n}` : "0 / 0";
  $("autoPill").textContent = "自動複製：" + (S.auto ? "開" : "關");
  $("autoPill").className = "pill" + (S.auto ? " ok" : "");
  $("modePill").textContent = S.col === 0 ? "複製：全行" : "複製：第 " + S.col + " 欄";

  const line = S.lines[S.idx];
  if(!line){
    $("no").textContent = "第 0 個";
    $("big").textContent = n ? "（已到尾）" : "請先喺下面貼上你嘅清單（一行一個出入口）";
    $("big").className = "big";
    $("copyBox").textContent = "（剪貼板內容會顯示喺度）";
    $("copyBox").className = "copy empty";
    return;
  }
  $("no").textContent = `第 ${S.idx + 1} 個 / 共 ${n} 個`;
  $("big").textContent = line;
  $("big").className = "big" + (line.length > 34 ? " small" : "");
  const ct = copyTextOf(line);
  $("copyBox").textContent = ct || "（呢行冇對應嘅欄位）";
  $("copyBox").className = "copy" + (ct ? "" : " empty");
  if(doCopy && S.auto && ct) copy(ct);
}

function goto(i){
  const n = S.lines.length; if(!n) return;
  S.idx = Math.max(0, Math.min(n - 1, i));
  save(); render(true);
}
function step(d){ goto(S.idx + d); }

function apply(){
  S.raw = $("listBox").value;
  S.lines = S.raw.replace(/\r/g, "").split("\n").map(s => s.trim()).filter(Boolean);
  if(S.idx >= S.lines.length) S.idx = 0;
  save(); render(true);
  toast(S.lines.length ? `已載入 ${S.lines.length} 個項目` : "清單係空嘅");
}

$("btnNext").addEventListener("click", () => step(1));
$("btnPrev").addEventListener("click", () => step(-1));
$("btnCopy").addEventListener("click", () => {
  const l = S.lines[S.idx]; if(!l) return;
  copy(copyTextOf(l)).then(ok => toast(ok ? "已複製" : "複製失敗，請手動選取"));
});
$("btnCopyNext").addEventListener("click", () => {
  const l = S.lines[S.idx]; if(!l) return;
  copy(copyTextOf(l)).then(ok => toast(ok ? "已複製 → 去 system 貼上" : "複製失敗"));
  step(1);
});
$("btnApply").addEventListener("click", apply);
$("btnReset").addEventListener("click", () => { S.idx = 0; save(); render(false); toast("已重設到第 1 個"); });
$("colPick").addEventListener("change", () => { S.col = Number($("colPick").value); save(); render(false); });
$("autoPick").addEventListener("change", () => { S.auto = $("autoPick").value === "1"; save(); render(false); });
$("listBox").addEventListener("input", () => { S.raw = $("listBox").value; save(); });

document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "textarea" || tag === "input" || tag === "select") return;
  if(e.key === " " || e.key === "Enter"){ e.preventDefault(); $("btnCopyNext").click(); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if(e.key.toLowerCase() === "c"){ $("btnCopy").click(); }
});

load();
$("listBox").value = S.raw || "";
$("colPick").value = String(S.col);
$("autoPick").value = S.auto ? "1" : "0";
if(!S.lines.length && S.raw){
  S.lines = S.raw.replace(/\r/g, "").split("\n").map(s => s.trim()).filter(Boolean);
}
render(false);
if(!S.lines.length) $("setup").open = true;
</script>
</body>
</html>
