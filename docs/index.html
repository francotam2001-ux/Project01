<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOL教練">
<meta name="theme-color" content="#0a1428">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🎮 LOL 教練</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", sans-serif;
  background: #0a1428; color: #e8e8e8; min-height: 100vh; line-height: 1.6;
  padding-bottom: env(safe-area-inset-bottom);
}
.app { max-width: 640px; margin: 0 auto; padding: 14px 14px 40px; }

header { text-align: center; padding: 16px 0 12px; }
header h1 { font-size: 1.35rem; color: #c8aa6e; letter-spacing: 1px; }
header p { font-size: .76rem; color: #7a8ba0; margin-top: 4px; }

.card { background: #111c31; border: 1px solid #1e3a5f; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
.card h2 { font-size: .92rem; color: #c8aa6e; margin-bottom: 10px; }

label { display: block; font-size: .78rem; color: #8fa3b8; margin: 9px 0 4px; }
input, select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 9px; border: 1px solid #2a4a70;
  background: #0a1428; color: #e8e8e8; font-size: .95rem; font-family: inherit;
}
input:focus, select:focus { outline: none; border-color: #c8aa6e; }

.row { display: flex; gap: 8px; }
.row > div { flex: 1; }

.btn {
  display: block; width: 100%; padding: 14px; border-radius: 10px; border: none;
  font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer;
  margin-top: 12px; transition: .15s;
}
.btn-primary { background: linear-gradient(135deg, #c8aa6e, #a8873d); color: #0a1428; }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .5; }
.btn-sec { background: #1e3a5f; color: #e8e8e8; }
.btn-ghost { background: transparent; border: 1px solid #2a4a70; color: #8fa3b8; }

.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { flex: 1; padding: 11px; text-align: center; border-radius: 10px; background: #111c31;
  border: 1px solid #1e3a5f; font-size: .85rem; cursor: pointer; color: #8fa3b8; }
.tab.active { background: #1e3a5f; color: #c8aa6e; border-color: #c8aa6e; font-weight: 700; }

.toggle { background: none; border: none; color: #7a8ba0; font-size: .78rem; cursor: pointer;
  padding: 4px; width: 100%; text-align: left; font-family: inherit; }
#settings-body { display: none; }
#settings-body.show { display: block; }

.drop { border: 2px dashed #2a4a70; border-radius: 12px; padding: 24px 14px; text-align: center;
  cursor: pointer; background: #0d1728; transition: .2s; }
.drop:active { border-color: #c8aa6e; background: #16233a; }
.drop .icon { font-size: 2.2rem; }
.drop .txt { margin-top: 6px; color: #8fa3b8; font-size: .88rem; }
.drop .sub { font-size: .72rem; color: #5a6b80; margin-top: 3px; }

#preview { max-width: 100%; border-radius: 10px; margin-top: 10px; display: none; }

#result-card { display: none; }
#result { white-space: pre-wrap; font-size: .9rem; line-height: 1.75; }
#result .err { color: #ff8a8a; }

.status { text-align: center; padding: 12px; color: #c8aa6e; font-size: .88rem; display: none; }
.status.show { display: block; }
.spinner { display: inline-block; width: 15px; height: 15px; border: 2px solid #c8aa6e;
  border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite;
  vertical-align: middle; margin-right: 7px; }
@keyframes spin { to { transform: rotate(360deg); } }

.actions { display: flex; gap: 8px; margin-top: 10px; }
.actions .btn { margin-top: 0; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: #c8aa6e; color: #0a1428; padding: 10px 20px; border-radius: 20px;
  font-size: .82rem; font-weight: 600; opacity: 0; transition: .3s; pointer-events: none; z-index: 9; }
.toast.show { opacity: 1; }

.hint { font-size: .72rem; color: #5a6b80; margin-top: 5px; }
.footer { text-align: center; font-size: .7rem; color: #3a4a60; margin-top: 18px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">

  <header>
    <h1>🎮 LOL 教練</h1>
    <p>激鬥峽谷 · 對線技巧 · 建議裝備 · 即時分析</p>
  </header>

  <!-- 設定 -->
  <div class="card">
    <button class="toggle" onclick="toggleSettings()">⚙️ 設定（API Key / 模型）▾</button>
    <div id="settings-body">
      <label>Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="貼上你嘅 Gemini API Key" autocomplete="off">
      <div class="hint">🔒 只儲存喺你部裝置，唔會上傳去其他地方</div>
      <label>AI 模型</label>
      <input type="text" id="model" value="gemini-3.8-flash">
      <button class="btn btn-sec" onclick="saveSettings()">💾 儲存設定</button>
    </div>
  </div>

  <!-- 模式切換 -->
  <div class="tabs">
    <div class="tab active" id="tab-img" onclick="switchMode('img')">📸 圖片</div>
    <div class="tab" id="tab-lane" onclick="switchMode('lane')">🧭 對線</div>
    <div class="tab" id="tab-draft" onclick="switchMode('draft')">🎯 選角</div>
  </div>

  <!-- 英雄資料輸入 -->
  <div class="card">
    <h2>🧙 你嘅資料</h2>
    <div class="row">
      <div>
        <label>你嘅英雄</label>
        <input id="myChamp" placeholder="例：吉茵珂絲">
      </div>
      <div>
        <label>位置</label>
        <select id="myRole">
          <option value="">-- 揀位置 --</option>
          <option>上路</option>
          <option>打野</option>
          <option>中路</option>
          <option>射手</option>
          <option>輔助</option>
        </select>
      </div>
    </div>
    <label>對線對手（敵方英雄）</label>
    <input id="enemyChamp" placeholder="例：達瑞斯">
    <label>敵方全隊陣容（選角分析用，用逗號分隔）</label>
    <input id="enemyTeam" placeholder="例：達瑞斯, 李星, 阿璃, 吉茵珂絲, 瑟雷西">
    <label>目前遊戲時間 / 情況（可選）</label>
    <input id="gameInfo" placeholder="例：開局 5 分鐘，對面 2 個頭">
  </div>

  <!-- 圖片上傳（只喺圖片模式顯示） -->
  <div class="card" id="upload-card">
    <h2>📷 上傳截圖</h2>
    <div class="drop" onclick="document.getElementById('file').click()">
      <div class="icon">🖼️</div>
      <div class="txt">點擊揀相 / 即場拍照</div>
      <div class="sub">可以係激鬥峽谷截圖，或者影其他屏幕</div>
    </div>
    <input type="file" id="file" accept="image/*" capture="environment" hidden>
    <img id="preview" alt="預覽">
  </div>

  <button class="btn btn-primary" id="goBtn" onclick="run()">🔍 開始分析</button>

  <div class="status" id="status"></div>

  <!-- 結果 -->
  <div class="card" id="result-card">
    <h2>📊 分析結果</h2>
    <div id="result"></div>
    <div class="actions">
      <button class="btn btn-sec" onclick="copyResult()">📋 複製</button>
      <button class="btn btn-sec" onclick="clearResult()">🗑️ 清除</button>
    </div>
  </div>

  <div class="footer">For Wild Rift &amp; LoL players • Powered by Gemini</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定 ===== */
function toggleSettings() { document.getElementById('settings-body').classList.toggle('show'); }
function saveSettings() {
  localStorage.setItem('lol_gemini_key', document.getElementById('apiKey').value.trim());
  localStorage.setItem('lol_gemini_model', document.getElementById('model').value.trim() || 'gemini-3.8-flash');
  toast('✅ 設定已儲存');
}
(function init() {
  const key = localStorage.getItem('lol_gemini_key') || '';
  const model = localStorage.getItem('lol_gemini_model') || 'gemini-3.8-flash';
  document.getElementById('apiKey').value = key;
  document.getElementById('model').value = model;
  if (!key) document.getElementById('settings-body').classList.add('show');
  // 記住上次輸入
  document.getElementById('myChamp').value = localStorage.getItem('wr_champ') || '';
  document.getElementById('myRole').value = localStorage.getItem('wr_role') || '';
  document.getElementById('enemyChamp').value = localStorage.getItem('wr_enemy') || '';
  document.getElementById('enemyTeam').value = localStorage.getItem('wr_team') || '';
})();

/* ===== 模式切換 ===== */
let mode = 'img';
function switchMode(m) {
  mode = m;
  document.getElementById('tab-img').classList.toggle('active', m === 'img');
  document.getElementById('tab-lane').classList.toggle('active', m === 'lane');
  document.getElementById('tab-draft').classList.toggle('active', m === 'draft');
  document.getElementById('upload-card').classList.toggle('hidden', m !== 'img');
  const labels = { img: '🔍 分析截圖', lane: '🧭 對線建議', draft: '🎯 分析選角' };
  document.getElementById('goBtn').textContent = labels[m];
  if (m !== 'img') document.getElementById('result-card').style.display = 'none';
}

/* ===== 圖片處理 ===== */
let currentImageData = null;
function handleFile(f) {
  if (!f) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 1600;
      let w = img.width, h = img.height;
      if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      currentImageData = c.toDataURL('image/jpeg', 0.85).split(',')[1];
      const p = document.getElementById('preview');
      p.src = 'data:image/jpeg;base64,' + currentImageData;
      p.style.display = 'block';
      document.getElementById('result-card').style.display = 'none';
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(f);
}
document.getElementById('file').addEventListener('change', (e) => handleFile(e.target.files[0]));
document.addEventListener('paste', (e) => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) if (it.type.indexOf('image') === 0) { handleFile(it.getAsFile()); toast('📋 已貼上圖片'); }
});

/* ===== 收集輸入 ===== */
function getUserInfo() {
  const my = document.getElementById('myChamp').value.trim();
  const role = document.getElementById('myRole').value;
  const enemy = document.getElementById('enemyChamp').value.trim();
  const team = document.getElementById('enemyTeam').value.trim();
  const info = document.getElementById('gameInfo').value.trim();
  localStorage.setItem('wr_champ', my);
  localStorage.setItem('wr_role', role);
  localStorage.setItem('wr_enemy', enemy);
  localStorage.setItem('wr_team', team);
  let s = '';
  if (my) s += `我玩：${my}` + (role ? `（${role}）` : '') + '\n';
  if (enemy) s += `對線對手：${enemy}\n`;
  if (team) s += `敵方陣容：${team}\n`;
  if (info) s += `目前情況：${info}\n`;
  return s;
}


/* ===== 提示詞 ===== */
const LANE_PROMPT = (info) => `你係《英雄聯盟：激鬥峽谷》(Wild Rift) 嘅專業教練，熟悉激鬥峽谷嘅裝備同節奏（唔係 PC 版）。
${info}
請用繁體中文廣東話，針對性咁俾我建議：

1. 🧭 對線技巧
   - 呢個對線係優勢定劣勢？
   - 開局點應對？幾時換血、幾時龜？
   - 有咩要小心（對手嘅關鍵技能/連招）？

2. 🛒 建議裝備（激鬥峽谷版本）
   - 頭 3 件應該買咩？為什麼？
   - 針對對手應該點調整？

3. ⚔️ 打法建議
   - 應該壓線、控線定推線？
   - 幾時去遊走/支援？
   - 團戰應該點企位？

4. ⚠️ 三大禁忌
   - 呢場最易犯嘅 3 個錯誤。

請分點、簡短、實際。`;

const IMG_PROMPT = (info) => `你係《英雄聯盟：激鬥峽谷》(Wild Rift) 專業教練。
${info}
請仔細睇呢張遊戲截圖，用繁體中文廣東話分析：

1. 📦 裝備識別：我方同敵方嘅裝備係咩？
2. 📊 戰況分析：邊一方優勢？為什麼？
3. 🛒 建議裝備：我下一件買咩？為什麼？
4. 🧭 對線/打法：而家應該點打？有咩危險？
5. 💡 三個最優先嘅行動建議。

如果唔係遊戲畫面，請直接話我知。`;

const DRAFT_PROMPT = (info) => `你係《英雄聯盟：激鬥峽谷》(Wild Rift) 專業教練，熟悉選角同對線。
${info}
而家係選角階段，請用繁體中文廣東話分析：

1. 🎯 邊個係我對線對手？
   - 根據我嘅位置同敵方陣容，判斷邊個敵人會同我對線。
   - 如果係打野/輔助，講埋我主要會遇到邊個。

2. ⚖️ 對線優劣勢
   - 呢個對線我係優勢定劣勢？為什麼？

3. 🧭 點同佢對線？（最重要）
   - 開局 1-3 級點打？
   - 幾時可以換血？有咇連招？
   - 對手有咇關鍵技能要小心？
   - 幾時要龜塔、幾時可以壓？

4. 🛒 建議裝備（激鬥峽谷）
   - 針對呢個對手，頭 3 件買咇？

5. ⚠️ 三大禁忌
   - 呢個對線最易犯嘅 3 個錯。

請分點、簡短、實際。`;

/* ===== 呼叫 Gemini ===== */
async function callGemini(prompt, withImage) {
  const key = document.getElementById('apiKey').value.trim();
  const model = document.getElementById('model').value.trim() || 'gemini-3.8-flash';
  if (!key) { document.getElementById('settings-body').classList.add('show'); throw new Error('請先填 API Key'); }
  localStorage.setItem('lol_gemini_key', key);
  localStorage.setItem('lol_gemini_model', model);

  const parts = [{ text: prompt }];
  if (withImage && currentImageData) parts.push({ inline_data: { mime_type: 'image/jpeg', data: currentImageData } });

  const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key);
  const res = await fetch(url, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents: [{ parts }] })
  });
  const data = await res.json();
  if (data.candidates && data.candidates[0]) {
    return data.candidates[0].content.parts.map(p => p.text || '').join('');
  }
  throw new Error((data.error && data.error.message) || '未知錯誤');
}

/* ===== 主流程 ===== */
async function run() {
  const info = getUserInfo();
  const withImage = (mode === 'img');
  if (withImage && !currentImageData) { toast('❌ 請先上傳截圖'); return; }
  if (mode === 'draft' && !document.getElementById('enemyTeam').value.trim() && !document.getElementById('enemyChamp').value.trim()) { toast('❌ 請填敵方陣容'); return; }
  if (mode === 'lane' && !info.trim()) { toast('❌ 請至少填你嘅英雄同對手'); return; }

  const btn = document.getElementById('goBtn');
  btn.disabled = true;
  const statusMsg = { img: '🤖 分析緊你嘅截圖...', lane: '🧭 整緊對線建議...', draft: '🎯 分析緊選角...' };
  showStatus(true, statusMsg[mode]);
  document.getElementById('result-card').style.display = 'none';

  try {
    const prompt = mode === 'img' ? IMG_PROMPT(info) : (mode === 'draft' ? DRAFT_PROMPT(info) : LANE_PROMPT(info));
    const text = await callGemini(prompt, withImage);
    showResult(text, false);
  } catch (err) {
    showResult('❌ ' + err.message + '\n\n💡 如果話模型唔存在，改設定入面嘅模型名', true);
  } finally {
    showStatus(false);
    btn.disabled = false;
  }
}

function showStatus(show, msg) {
  const s = document.getElementById('status');
  if (show) { s.innerHTML = '<span class="spinner"></span>' + msg; s.classList.add('show'); }
  else s.classList.remove('show');
}
function showResult(text, isErr) {
  const el = document.getElementById('result');
  el.innerHTML = isErr ? '<span class="err">' + esc(text) + '</span>' : esc(text);
  const c = document.getElementById('result-card');
  c.style.display = 'block';
  c.scrollIntoView({ behavior: 'smooth' });
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function copyResult() { navigator.clipboard.writeText(document.getElementById('result').innerText).then(() => toast('📋 已複製')); }
function clearResult() { document.getElementById('result-card').style.display = 'none'; document.getElementById('result').innerHTML = ''; }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== 註冊 Service Worker（PWA）===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
